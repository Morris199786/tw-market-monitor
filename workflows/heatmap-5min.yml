name: Heatmap 5min
on:
  schedule:
    # UTC 01:00-05:59 = 台灣 09:00-13:59，週一至週五
    - cron: "*/5 1-5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heatmap
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - run: pip install -r requirements.txt

      - name: Refresh master if missing
        run: |
          python scripts/update_master.py

      - name: Update heatmap
        run: python scripts/update_heatmap.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master.json data/heatmap.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: heatmap update"
          git pull --rebase
          git push
