name: Restore original broker report view
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-report-processing
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore original broker renderer (zero API)
        run: |
          python scripts/fix_broker_original_view.py
          git diff --check
          grep -q 'original-broker-v3-view-v1' assets/research_merged.js
          echo '[SUCCESS] Broker category uses original reports_v2.js renderer'
      - name: Commit frontend only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/research_merged.js
          if ! git diff --cached --quiet; then
            git commit -m 'Restore original broker AI report presentation'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
