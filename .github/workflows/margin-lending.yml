name: Margin lending update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: margin-lending
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update margin and lending
        run: python scripts/update_margin_lending.py

      - name: Detect page changes
        id: changed
        shell: bash
        run: |
          if git diff --quiet -- data/margin_lending.json; then
            echo "margin=false" >> "$GITHUB_OUTPUT"
          else
            echo "margin=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/margin_lending.json data/history/margin_lending

          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi

          git commit -m "data: margin lending update"
          git pull --rebase
          git push

      - name: Telegram - 融資／借券
        if: steps.changed.outputs.margin == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_SITE_URL: https://morris199786.github.io/tw-market-monitor/
        run: python scripts/send_update_telegram.py marginLending
