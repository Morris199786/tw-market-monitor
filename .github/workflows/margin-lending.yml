name: Margin lending update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: margin-lending
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Read previous data date
        id: previous
        shell: bash
        run: |
          OLD_DATE="$(python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/margin_lending.json")

          try:
              data = json.loads(
                  p.read_text(encoding="utf-8")
              )
              print(
                  str(
                      data.get("date") or ""
                  ).strip()
              )
          except Exception:
              print("")
          PY
          )"

          echo "date=$OLD_DATE" >> "$GITHUB_OUTPUT"
          echo "Previous data date: $OLD_DATE"

      - name: Update margin and lending
        run: python scripts/update_margin_lending.py

      - name: Check new data date
        id: changed
        shell: bash
        env:
          OLD_DATE: ${{ steps.previous.outputs.date }}
        run: |
          NEW_DATE="$(python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/margin_lending.json")

          try:
              data = json.loads(
                  p.read_text(encoding="utf-8")
              )
              print(
                  str(
                      data.get("date") or ""
                  ).strip()
              )
          except Exception:
              print("")
          PY
          )"

          echo "new_date=$NEW_DATE" >> "$GITHUB_OUTPUT"

          if [ -n "$NEW_DATE" ] && [ "$NEW_DATE" != "$OLD_DATE" ]; then
            echo "notify=true" >> "$GITHUB_OUTPUT"
            echo "New trading date detected: $OLD_DATE -> $NEW_DATE"
          else
            echo "notify=false" >> "$GITHUB_OUTPUT"
            echo "Same trading date, Telegram notification skipped: $NEW_DATE"
          fi

      - name: Commit updated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/margin_lending.json data/history/margin_lending

          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi

          git commit -m "data: margin lending update"
          git pull --rebase
          git push

      - name: Telegram - 融資／借券賣出
        if: steps.changed.outputs.notify == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_SITE_URL: https://morris199786.github.io/tw-market-monitor/
        run: python scripts/send_update_telegram.py marginLending
