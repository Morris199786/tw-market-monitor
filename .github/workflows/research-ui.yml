name: Research UI (four tabs, no AI)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-ui
  cancel-in-progress: false

jobs:
  update-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update research UI
        run: python scripts/update_research_ui.py

      - name: Validate JavaScript syntax
        run: node --check assets/research_merged.js

      - name: Commit updated frontend
        run: |
          if git diff --quiet -- assets/research_merged.js; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/research_merged.js
          git commit -m "Update research UI categories"
          git push
