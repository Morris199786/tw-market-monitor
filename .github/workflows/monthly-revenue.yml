name: Monthly revenue update

on:
  schedule:
    # 台灣時間每月 1～15 日
    # 10:00 / 14:00 / 18:00 / 21:00
    - cron: "0 2 1-15 * *"
    - cron: "0 6 1-15 * *"
    - cron: "0 10 1-15 * *"
    - cron: "0 13 1-15 * *"

  repository_dispatch:
    types: [monthly_revenue]

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-revenue
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update monthly revenue
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/update_monthly_revenue.py

      - name: Commit updated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/monthly_revenue.json \
            data/monthly_revenue_tracker.json \
            data/monthly_revenue_sent.json \
            data/monthly_revenue_history.json

          if git diff --cached --quiet; then
            echo "No monthly revenue changes"
            exit 0
          fi

          git commit -m "data: monthly revenue update"

          success=false

          for i in 1 2 3 4 5; do
            echo "Push attempt $i/5"

            if ! git pull --rebase origin main; then
              echo "Rebase failed"
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              success=true
              echo "Monthly revenue data pushed successfully"
              break
            fi

            echo "Remote changed before push, retrying..."
            sleep 5
          done

          if [ "$success" != "true" ]; then
            echo "Push failed after 5 attempts"
            exit 1
          fi
