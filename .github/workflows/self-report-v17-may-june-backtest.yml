name: V17 May June Private Backtest
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install V17 dependencies
        run: pip install numpy==2.1.3 scikit-learn==1.6.1 scipy==1.14.1 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Download already-successful H1 attention backfill artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p private_h1_backfill
          gh run download 39538787871 -R "${{ github.repository }}" -n v17-h1-attention-backfill -D private_h1_backfill
          test -s private_h1_backfill/attention_2026_h1.json
          test -s private_h1_backfill/trading_calendar_2026_h1.json
      - name: Fetch historical MOPS January-April privately
        run: python scripts/self_report_history_backfill.py --start 2026-01-01 --end 2026-04-30 --out private_h1_mops/jan_apr
      - name: Fetch historical MOPS May-June privately
        run: python scripts/self_report_history_backfill.py --start 2026-05-01 --end 2026-06-30 --out private_h1_mops/may_jun
      - name: Audit MOPS coverage and build V17 event labels
        run: python scripts/self_report_v17_h1_complete.py --historical private_h1_mops --out private_h1_verified
      - name: Run isolated walk-forward evaluation
        run: |
          python scripts/self_report_v17_may_june_backtest.py \
            --notices private_h1_backfill/attention_2026_h1.json \
            --events private_h1_verified/events_2026_h1.csv \
            --calendar private_h1_backfill/trading_calendar_2026_h1.json \
            --out private_backtest_may_june
      - name: Upload private raw inputs, audits and results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-may-june-private-backtest-audit
          path: |
            private_h1_mops/
            private_h1_verified/
            private_backtest_may_june/
          retention-days: 30
          if-no-files-found: warn
