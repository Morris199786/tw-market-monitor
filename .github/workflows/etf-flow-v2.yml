
name: ETF Flow Active Equity Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '15 15 * * *' # 台灣每日 23:15

permissions:
  contents: write
  id-token: write

concurrency:
  group: etf-flow-active-v2
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud with existing Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: id-tw-market-drive-reader@project-0c762295-9cd6-4a78-a63.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only importer dependencies
        run: python -m pip install google-api-python-client google-auth openpyxl requests

      - name: Collect TWSE/TPEx official turnover-based market averages
        run: python scripts/update_etf_market_prices.py --backfill-days 18

      - name: Build from source Sheet with official market averages
        env:
          ETFFLOW_SHEET_ID: 1BzgyIoIo_Fq8GhLKU3smRaVv5XjD7BMskgsxckTPIl8
        run: python scripts/update_etf_flow.py --market-csv /tmp/etf-flow-market.csv

      - name: Commit validated data only
        run: |
          git add data/etf-flow-v2
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update active ETF Flow and official TWSE/TPEx averages'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
