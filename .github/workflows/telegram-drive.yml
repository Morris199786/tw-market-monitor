name: Telegram PDF to Google Drive

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  id-token: write

concurrency:
  group: telegram-drive-ingest
  cancel-in-progress: false

jobs:
  upload-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync state
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Authenticate Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive

      - name: Install Python dependencies
        run: python -m pip install requests requests-toolbelt

      - name: Upload Telegram PDFs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          TELEGRAM_REPORT_CHAT_TITLE: 券商報告
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          DRIVE_FOLDER_ID: 1HCAfe0ohQIucD0ob3ziLI_JgePh0Uy9L
        run: python scripts/telegram_drive_ingest.py

      - name: Commit processed Telegram offset
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/telegram_drive_state.json
          if git diff --cached --quiet; then
            echo 'No new Telegram updates'
            exit 0
          fi
          git commit -m 'Track Telegram broker PDF ingestion'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          exit 1
