name: Shared financial catalog shadow audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/shared_financial_catalog.py'
      - 'scripts/test_shared_financial_catalog.py'
      - '.github/workflows/shared-financial-shadow.yml'
      - 'scripts/shared_financial_shadow_compare.py'
      - 'scripts/test_shared_financial_shadow_compare.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/shared_financial_catalog.py scripts/test_shared_financial_catalog.py
      - run: PYTHONPATH=scripts python -m unittest discover -s scripts -p test_shared_financial_catalog.py
      - run: python scripts/shared_financial_catalog.py --output /tmp/shared-financial-shadow
      - run: PYTHONPATH=scripts python -m unittest discover -s scripts -p test_shared_financial_shadow_compare.py
      - run: python scripts/shared_financial_shadow_compare.py --output /tmp/shared-financial-shadow
      - uses: actions/upload-artifact@v4
        with:
          name: shared-financial-shadow
          path: /tmp/shared-financial-shadow
