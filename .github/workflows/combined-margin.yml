          fi
      - name: Fetch official cash balances
        id: fetch
        continue-on-error: true
        run: python3 "$RUNNER_TEMP/update_tpex_margin.py"
      - name: Compare old and new signals on full history
        if: ${{ steps.fetch.outcome == 'success' }}
        run: node "$RUNNER_TEMP/backtest_combined_margin.cjs"
      - name: Report unfinished collection after saving checkpoints
        if: ${{ steps.fetch.outcome == 'failure' }}
        run: |
          echo 'Collection unfinished. Every completed checkpoint was already committed to GitHub main.' >&2
          exit 1
