name: 上市櫃融資歷史回補與每日更新
# v20261120-checkpoint-v2: 每 25 筆成功交易日寫回 main；僅更新融資 JSON，避免 index.html rebase 衝突。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/combined-margin.yml'
      - 'data/market_monitor.json'
      - 'data/history/monitor-funds-2008-2023.json'
  schedule:
    - cron: '35 14,20 * * *'
permissions:
  contents: write
concurrency:
  group: combined-market-margin
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare safe per-batch GitHub checkpoint publisher
        run: |
          cat > "$RUNNER_TEMP/publish_margin_checkpoint.py" <<'SOURCE'
          """Publish only verified TPEx JSON to fresh main, without rebasing UI files."""
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          LOCAL = Path('data/market_margin_tpex.json')
          WT = Path(os.environ['RUNNER_TEMP']) / 'margin-checkpoint-worktree'
          REL = Path('data/market_margin_tpex.json')

          def git(*args, cwd=None, check=True):
              return subprocess.run(['git', *args], cwd=cwd, check=check, text=True,
                                    stdout=subprocess.PIPE, stderr=subprocess.PIPE)

          def valid(payload):
              if payload.get('unit') != 'TWD' or not isinstance(payload.get('rows'), dict):
                  raise ValueError('Incorrect cash-balance schema or unit')
              for day, pair in payload['rows'].items():
                  if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', day):
                      raise ValueError('Invalid date: ' + str(day))
                  if (not isinstance(pair, list) or len(pair) != 2 or
                      not all(type(n) is int and n > 0 for n in pair)):
                      raise ValueError('Invalid amounts on ' + str(day))
              return payload['rows']

          def main():
              local = valid(json.loads(LOCAL.read_text()))
              if not WT.exists():
                  git('worktree', 'add', '--detach', str(WT), 'HEAD')
              for attempt in range(1, 6):
                  print(f'CHECKPOINT: syncing verified rows to main (attempt {attempt}/5)', flush=True)
                  git('fetch', '--quiet', 'origin', 'main')
                  git('reset', '--hard', 'origin/main', cwd=WT)
                  dest = WT / REL
                  remote = valid(json.loads(dest.read_text())) if dest.exists() else {}
                  merged = dict(remote)
                  merged.update(local)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_text(json.dumps({'unit':'TWD', 'rows':dict(sorted(merged.items()))},
                                             ensure_ascii=False, sort_keys=True,
                                             separators=(',', ':'))+'\n')
                  git('add', '--', str(REL), cwd=WT)
                  diff = git('diff', '--cached', '--quiet', cwd=WT, check=False)
                  if diff.returncode == 0:
                      print('CHECKPOINT: already saved on main', flush=True)
                      return
                  if diff.returncode != 1:
                      raise RuntimeError('Failed to inspect staged JSON')
                  git('config', 'user.name', 'github-actions[bot]', cwd=WT)
                  git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com', cwd=WT)
                  git('commit', '-m', 'data: checkpoint verified TPEx financing balances', cwd=WT)
                  pushed = git('push', 'origin', 'HEAD:main', cwd=WT, check=False)
                  if pushed.returncode == 0:
                      print(f'CHECKPOINT: published {len(merged)} rows to main', flush=True)
                      return
                  print(f'CHECKPOINT: push race on attempt {attempt}; retrying', file=sys.stderr, flush=True)
              raise RuntimeError('Could not publish checkpoint after 5 retries')

          if __name__ == '__main__':
              main()
          SOURCE
      - name: Prepare update_tpex_margin.py
        run: |
          cat > "$RUNNER_TEMP/update_tpex_margin.py" <<'SOURCE'
          """Maintain the TPEx cash-balance series for the Taiwan monitor, in Taiwan dollars."""
          import json
          import os
          import subprocess
          import re
          import sys
          import time
          import unicodedata
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          DEST = Path("data/market_margin_tpex.json")
          URL = "https://www.tpex.org.tw/www/zh-tw/margin/balance"


          def parse_report(report, day):
              if report.get("date") != day.replace("-", "") or report.get("stat") != "ok":
                  raise ValueError(f"{day}: missing report or report date mismatch")
              for table in report["tables"]:
                  fields = table.get("fields", [])
                  if "資餘額" not in fields:
                      continue
                  previous = next(i for i, name in enumerate(fields) if name.startswith("前資餘額"))
                  current = fields.index("資餘額")
                  rows = [r for r in table.get("summary", []) if len(r) > current and
                          unicodedata.normalize("NFKC", str(r[1])).replace(" ", "") in
                          ("融資金(仟元)", "融資金(千元)")]
                  if len(rows) != 1:
                      continue
                  amounts = [str(rows[0][i]).strip().replace(",", "") for i in (previous, current)]
                  if all(re.fullmatch(r"[0-9]+", amount) and int(amount) > 0 for amount in amounts):
                      return [int(amount) * 1000 for amount in amounts]
              raise ValueError(f"{day}: missing cash summary")


          def fetch(day):
              url = URL + "?" + urlencode({"date": day.replace("-", "/"), "response": "json"})
              request = Request(url, headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json"})
              for attempt in range(3):
                  try:
                      with urlopen(request, timeout=20) as response:
                          return parse_report(json.load(response), day)
                  except (OSError, ValueError, KeyError, StopIteration) as exc:
                      if attempt == 2:
                          raise RuntimeError(f"{day}: {exc}") from exc
                      time.sleep(2 ** (attempt + 1))


          def checkpoint(rows, expected):
              # Persist to runner disk, then to remote GitHub main immediately.
              tmp = DEST.with_suffix('.tmp')
              tmp.write_text(json.dumps({'unit': 'TWD', 'rows': rows},
                                        sort_keys=True, separators=(',', ':')) + '\n')
              tmp.replace(DEST)
              command = [sys.executable,
                         str(Path(os.environ['RUNNER_TEMP']) / 'publish_margin_checkpoint.py')]
              subprocess.run(command, check=True)
              print(f'CHECKPOINT: {len(rows.keys() & expected)}/{len(expected)} verified days saved to GitHub', flush=True)

          def main():
              recent = json.loads(Path('data/market_monitor.json').read_text())['rows']
              archive = json.loads(Path('data/history/monitor-funds-2008-2023.json').read_text())
              days = sorted({r['date'] for r in archive + recent})
              expected = set(days)
              result = json.loads(DEST.read_text()) if DEST.exists() else {'unit': 'TWD', 'rows': {}}
              if result.get('unit') != 'TWD' or not isinstance(result.get('rows'), dict):
                  raise ValueError('Invalid local TPEx cash-balance data')
              rows = result['rows']
              due = sorted(set(days[-3:]) | (expected - rows.keys()), reverse=True)
              print(f'CHECKPOINT START: saved {len(rows.keys() & expected)}/{len(expected)}, to fetch {len(due)}', flush=True)
              deadline = time.monotonic() + 4 * 60 * 60
              failures = consecutive = successful_since_checkpoint = 0
              try:
                  for i, day in enumerate(due, 1):
                      try:
                          rows[day] = fetch(day)
                          successful_since_checkpoint += 1
                          consecutive = 0
                      except RuntimeError as exc:
                          print(exc, file=sys.stderr, flush=True)
                          failures += 1
                          consecutive += 1
                      if successful_since_checkpoint >= 25:
                          checkpoint(rows, expected)
                          successful_since_checkpoint = 0
                      if consecutive >= 5 or time.monotonic() >= deadline:
                          break
                      time.sleep(0.55)
              finally:
                  # All completed fetches survive a later API failure or time limit.
                  if successful_since_checkpoint or not DEST.exists():
                      checkpoint(rows, expected)
              missing = expected - rows.keys()
              print(f'Expected {len(days)}, missing {len(missing)}, request failures {failures}.', flush=True)
              return int(bool(missing or failures))


          if __name__ == "__main__":
              sys.exit(main())
          SOURCE
      - name: Prepare backtest_combined_margin.cjs
        run: |
          cat > "$RUNNER_TEMP/backtest_combined_margin.cjs" <<'SOURCE'
          // Run the site's actual signal functions against the same daily inputs as the dashboard.
          const fs = require('node:fs');
          const vm = require('node:vm');
          const read = file => JSON.parse(fs.readFileSync('data/' + file, 'utf8'));
          const source = fs.readFileSync('assets/market_monitor.js', 'utf8');
          const end = source.indexOf('function paintTwRisk(');
          if (end < 0) throw Error('Cannot locate risk engine');
          const engine = {};
          vm.runInNewContext(source.slice(0, end), engine);
          const funds = read('history/monitor-funds-2008-2023.json').concat(read('market_monitor.json').rows);
          const breadth = read('history/monitor-breadth-2008-2023.json').all.concat(read('market_breadth.json').series.all);
          const otc = read('market_margin_tpex.json');
          if (otc.unit !== 'TWD') throw Error('Unexpected unit');
          const daily = engine.applyCombinedMargin(funds, otc.rows);
          if (daily.some(r => r.margin == null || !Number.isFinite(r.index) || r.index <= 0)) {
            throw Error('Incomplete financing or index history. Full-period statistics withheld.');
          }
          const old = engine.buildTwRisk(funds, breadth);
          const next = engine.buildTwRisk(daily, breadth);
          const common = daily.map(r => old.has(r.date) && next.has(r.date));
          function summarize(signals, threshold) {
            const episodes = [];
            let last = -Infinity;
            for (let i = 1; i < daily.length; i++) {
              if (!common[i] || !common[i-1] || i-last <= 20) continue;
              if (signals.get(daily[i].date).level < threshold ||
                  signals.get(daily[i-1].date).level >= threshold) continue;
              last = i;
              const following = daily.slice(i+1, i+21);
              const drop = following.length === 20 ? Math.min(...following.map(r => r.index)) / daily[i].index - 1 : null;
              episodes.push({date:daily[i].date, hit:drop == null ? null : drop <= -0.05, worst_return:drop});
            }
            const hits = episodes.filter(e => e.hit === true).length;
            const misses = episodes.filter(e => e.hit === false).length;
            return {hits, false_alarms:misses, pending:episodes.length-hits-misses,
              hit_rate:hits+misses ? hits/(hits+misses) : null, episodes};
          }
          const latest = daily.at(-1).date.slice(0,7);
          const output = {start:daily[0].date, end:daily.at(-1).date, common_signal_days:common.filter(Boolean).length,
            definition:'收盤首次升至指定層級，20 個交易日內同級去重。後續 20 個收盤較亮燈日收盤再跌至少 5% 算命中。期末不足 20 日列待觀察。',
            monthly_detail:daily.filter(r => r.date.startsWith(latest)).map(r => ({
              date:r.date, combined:r.margin, old_level:old.get(r.date)?.level ?? null,
              new_level:next.get(r.date)?.level ?? null, basis:next.get(r.date)?.basis ?? null})),
            listed_only:{orange_or_red:summarize(old, 2), red:summarize(old, 3)},
            combined:{orange_or_red:summarize(next, 2), red:summarize(next, 3)}};
          fs.writeFileSync('data/market_margin_backtest.json', JSON.stringify(output,null,2)+'\n');
          for (const [scope,stats] of Object.entries({上市:output.listed_only, 上市櫃:output.combined})) {
            for(const [light, v] of Object.entries(stats)) console.log(scope, light, '命中', v.hits, '誤報', v.false_alarms, '待觀察', v.pending);
          }
          SOURCE
