name: Fix broker report search
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fix-broker-report-search
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove competing legacy renderer and bust cached JS
        shell: python
        run: |
          from pathlib import Path
          import re
          app = Path('assets/app.js')
          s = app.read_text(encoding='utf-8')
          pattern = r'(const pageLoaders\s*=\s*\{)(.*?)(\n\};)'
          m = re.search(pattern, s, re.S)
          if not m:
              raise SystemExit('Cannot find pageLoaders; no files changed')
          body = m.group(2)
          fixed, n = re.subn(r',\s*reports\s*(?=\n|$)', '', body)
          if n == 0 and re.search(r'(?m)^\s*reports\s*,?\s*$', body):
              fixed, n = re.subn(r'(?m)^\s*reports\s*,?\s*\n?', '', body)
          if n == 0 and re.search(r'(?m)^\s*reports\s*$', body):
              fixed, n = re.subn(r'(?m)^\s*reports\s*$', '', body)
          if n == 0 and 'reports' in body:
              raise SystemExit('Legacy reports loader not removed; abort')
          if n:
              s = s[:m.start(2)] + fixed + s[m.end(2):]
              app.write_text(s, encoding='utf-8')
          html = Path('index.html')
          h = html.read_text(encoding='utf-8')
          versions = {
              'assets/app.js': '20261022-report-search-single-renderer',
              'assets/reports_v2.js': '20261022-report-search-single-renderer',
          }
          for filename, version in versions.items():
              rx = r'(src="\./' + re.escape(filename) + r'\?v=)[^" ]+'
              h, count = re.subn(rx, lambda m: m.group(1) + version, h)
              if count != 1:
                  raise SystemExit(f'Expected one script tag for {filename}, got {count}')
          html.write_text(h, encoding='utf-8')
          print('Fixed: only reports_v2.js renders broker reports; JS cache version updated')
      - name: Check syntax
        run: |
          node --check assets/app.js
          node --check assets/reports_v2.js
          git diff --check
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/app.js index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Fix broker search legacy renderer collision and refresh JS cache'
            git push
          else
            echo 'Already fixed; no changes'
          fi
