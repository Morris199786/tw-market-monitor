name: US daily news
on:
  push:
    branches: [main]
    paths: [data/us_daily_news.json]
permissions:
  contents: read
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            data/us_daily_news.json
            scripts/send_us_daily_news.py
          sparse-checkout-cone-mode: false
      - name: Fetch previous commit
        env:
          NEWS_BEFORE: ${{ github.event.before }}
        run: |
          if [[ -n "$NEWS_BEFORE" && ! "$NEWS_BEFORE" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$NEWS_BEFORE"
          fi
      - name: Validate and send Telegram
        env:
          NEWS_BEFORE: ${{ github.event.before }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_us_daily_news.py
