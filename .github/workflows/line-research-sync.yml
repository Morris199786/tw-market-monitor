name: LINE research sync and incremental AI
on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'check=只檢查；sync=同步B欄；recover_85=無API恢復#85已成功7篇；ai=增量解析；failed=僅重試一次'
        required: true
        type: choice
        options: [check, sync, recover_85, ai, failed, rerun_three, retry_mediatek, yingbang_only]
        default: check
      max_reports:
        description: 'ai模式本次最多API文章數（1–250）；只處理未嘗試文章'
        required: true
        default: '10'
        type: string
permissions:
  contents: write
  id-token: write
concurrency:
  group: research-report-processing
  cancel-in-progress: false
jobs:
  yingbang_only:
    if: ${{ inputs.run_mode == 'yingbang_only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh ledger and configure checkpoint identity
        run: |
          git pull --ff-only origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Initialize Telegram delivery baseline (no API)
        run: python scripts/notify_line_research.py init
      - name: Preview only Yingbang (no API)
        run: python scripts/research_ai_batch.py --mode yingbang_only --limit 1 --dry-run
      - name: Process or reuse only Yingbang
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEARCH_AI_REMOTE_CHECKPOINT: '1'
          RESEARCH_AI_MODEL: gpt-5.6-luna
        run: python scripts/research_ai_batch.py --mode yingbang_only --limit 1
      - name: Publish only Yingbang output and its audit
        if: always()
        run: |
          set -euo pipefail
          git add -- data/research_ai_cache.json data/research_ai_batch_history.json data/research_ai_render.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish bounded Yingbang-only research result'
            # Retry Git publication only. Do not rerun the paid AI step.
            pushed=0
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "Concurrent main update; retry Git push ($attempt/5)"
              sleep $((attempt * 3))
            done
            if [ "$pushed" -ne 1 ]; then
              echo '::error::Git publication failed after 5 retries; AI results remain checkpointed'
              exit 1
            fi
          fi
      - name: Notify newly published LINE research on Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_line_research.py send
      - name: Upload Yingbang processing audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yingbang-only-audit
          path: |
            data/research_ai_cache.json
            data/research_ai_batch_history.json
          if-no-files-found: ignore
  sync:
    if: ${{ inputs.run_mode != 'yingbang_only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh ledger
        run: git pull --ff-only origin main
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: id-tw-market-drive-reader@project-0c762295-9cd6-4a78-a63.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
      - name: Dependencies and git identity
        run: |
          python -m pip install requests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Initialize Telegram delivery baseline (no API)
        if: ${{ inputs.run_mode != 'check' }}
        run: python scripts/notify_line_research.py init
      - name: Read consistent Sheet snapshot
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          LINE_EXPECTED_SERVICE_ACCOUNT: id-tw-market-drive-reader@project-0c762295-9cd6-4a78-a63.iam.gserviceaccount.com
        run: |
          python - <<'PYCODE'
          import os,sys,json
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from sync_line_research import fetch_sheet
          p=Path(os.environ['RUNNER_TEMP'])/'research_sheet.json'
          p.write_text(json.dumps(fetch_sheet(os.environ['ACCESS_TOKEN']),ensure_ascii=False),encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write(f'LINE_SYNC_FIXTURE={p}\n')
          PYCODE
      - name: Check B-column selection and API routing without publishing
        if: ${{ inputs.run_mode == 'check' }}
        env:
          LINE_SYNC_DRY_RUN: '1'
        run: python scripts/sync_line_research.py
      - name: Publish B-column allowed research and API routing
        if: ${{ inputs.run_mode != 'check' }}
        run: python scripts/sync_line_research.py
      - name: Show API candidates without charges
        if: ${{ inputs.run_mode == 'ai' || inputs.run_mode == 'failed' || inputs.run_mode == 'rerun_three' || inputs.run_mode == 'retry_mediatek' || inputs.run_mode == 'yingbang_only' }}
        env:
          BATCH_LIMIT: ${{ inputs.max_reports }}
          RESEARCH_AI_MODEL: gpt-5.6-luna
        run: |
          if [ "${{ inputs.run_mode }}" = "yingbang_only" ]; then
            python scripts/research_ai_batch.py --limit 1 --category meeting --mode pending --article-id line-abf8ae3b2e0a9eae6703 --dry-run
          elif [ "${{ inputs.run_mode }}" = "retry_mediatek" ]; then
            python scripts/research_ai_batch.py --limit 1 --category all --mode retry_mediatek --dry-run
          elif [ "${{ inputs.run_mode }}" = "rerun_three" ]; then
            python scripts/research_ai_batch.py --limit 3 --category all --mode rerun_three --dry-run
          elif [ "${{ inputs.run_mode }}" = "failed" ]; then
            python scripts/research_ai_batch.py --limit "$BATCH_LIMIT" --category all --mode failed --dry-run
          else
            python scripts/research_ai_batch.py --limit "$BATCH_LIMIT" --category all --mode pending --dry-run
          fi
      - name: Analyze selected unprocessed articles
        if: ${{ inputs.run_mode == 'ai' || inputs.run_mode == 'failed' || inputs.run_mode == 'rerun_three' || inputs.run_mode == 'retry_mediatek' || inputs.run_mode == 'yingbang_only' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BATCH_LIMIT: ${{ inputs.max_reports }}
          RESEARCH_AI_REMOTE_CHECKPOINT: '1'
          RESEARCH_AI_MODEL: gpt-5.6-luna
        run: |
          if [ "${{ inputs.run_mode }}" = "yingbang_only" ]; then
            python scripts/research_ai_batch.py --limit 1 --category meeting --mode pending --article-id line-abf8ae3b2e0a9eae6703
          elif [ "${{ inputs.run_mode }}" = "retry_mediatek" ]; then
            python scripts/research_ai_batch.py --limit 1 --category all --mode retry_mediatek
          elif [ "${{ inputs.run_mode }}" = "rerun_three" ]; then
            python scripts/research_ai_batch.py --limit 3 --category all --mode rerun_three
          elif [ "${{ inputs.run_mode }}" = "failed" ]; then
            python scripts/research_ai_batch.py --limit "$BATCH_LIMIT" --category all --mode failed
          else
            python scripts/research_ai_batch.py --limit "$BATCH_LIMIT" --category all --mode pending
          fi
      - name: Republish AI results into research shards
        if: ${{ inputs.run_mode == 'ai' || inputs.run_mode == 'failed' || inputs.run_mode == 'rerun_three' || inputs.run_mode == 'retry_mediatek' || inputs.run_mode == 'yingbang_only' }}
        run: python scripts/sync_line_research.py
      - name: Verify run 85 recovered successes without paid API
        if: ${{ inputs.run_mode == 'recover_85' }}
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          cache=json.loads(Path('data/research_ai_cache.json').read_text(encoding='utf-8'))
          ids=['line-ee26cfa3136d6712ec9a','line-463fc2a3b5752e9842bf',
               'line-43c001238ef11697fd1a','line-953a5b5fb79b6675372d',
               'line-0bcec1fb666a5c42d7bb','line-6275a3cae8266c1cf128',
               'line-5190e40afdbe74a13e70']
          suffix='::failed-retry-once-v1'
          missing=[rid for rid in ids if not (
              isinstance(cache.get(rid),dict) and cache[rid].get('status')=='success'
              and isinstance(cache[rid].get('result'),dict)
              and isinstance(cache.get(rid+suffix),dict)
              and cache[rid+suffix].get('status')=='success')]
          if missing:
              raise SystemExit('RECOVERY_ABORT_MISSING_CHECKPOINT: '+', '.join(missing))
          print('RECOVERY_85_VERIFIED: 7 successful AI results already on main; no API used')
          PYCODE
      - name: Export research data and AI-direct display without API
        if: ${{ inputs.run_mode != 'check' }}
        run: python scripts/export_research_metrics.py
      - name: Commit all published data and processing ledger
        if: ${{ inputs.run_mode != 'check' }}
        run: |
          set -euo pipefail
          git add -A -- data/research_shards data/research_search data/research_meta.json data/research_manifest.json data/research_dedup_audit.json data/research_financial_forecasts.json data/research_financial_backfill_report.json data/research_financial_by_id data/research_metrics.json data/research_ai_render.json
          for f in data/research_ai_cache.json data/research_ai_batch_history.json; do
            if [ -f "$f" ]; then git add -- "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Sync B-column meeting research and bounded AI analysis'
            # Retry Git publication only. Do not rerun the paid AI step.
            pushed=0
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "Concurrent main update; retry Git push ($attempt/5)"
              sleep $((attempt * 3))
            done
            if [ "$pushed" -ne 1 ]; then
              echo '::error::Git publication failed after 5 retries; AI results remain checkpointed'
              exit 1
            fi
          else
            echo 'No changes'
          fi
      - name: Notify newly published LINE research on Telegram
        if: ${{ inputs.run_mode != 'check' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_line_research.py send
      - name: Upload research processing audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: line-research-audit
          path: |
            data/research_ai_cache.json
            data/research_ai_batch_history.json
            data/research_dedup_audit.json
            data/research_metrics.json
          if-no-files-found: ignore
