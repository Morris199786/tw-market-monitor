name: LINE research sync (3 months)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
  id-token: write
concurrency:
  group: line-research-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
      - name: Install requests
        run: python -m pip install requests
      - name: Sync without AI or Telegram
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          LINE_SYNC_DRY_RUN: '1'
        run: python scripts/sync_line_research.py
      # Safety: dry-run only until service account access and private data protection are verified.
      # No data is committed to this currently public repository.
