name: LINE research sync (3 months)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: read
concurrency:
  group: line-research-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install requests
        run: python -m pip install requests
      - name: Sync with user OAuth (dry run, no AI or Telegram)
        env:
          LINE_GOOGLE_CLIENT_ID: ${{ secrets.LINE_GOOGLE_CLIENT_ID }}
          LINE_GOOGLE_CLIENT_SECRET: ${{ secrets.LINE_GOOGLE_CLIENT_SECRET }}
          LINE_GOOGLE_REFRESH_TOKEN: ${{ secrets.LINE_GOOGLE_REFRESH_TOKEN }}
          LINE_SYNC_DRY_RUN: '1'
        run: python scripts/sync_line_research.py
      # Intentionally no commits: the repo is currently public.
      # Once data is hosted in a protected location, enable publishing separately.
