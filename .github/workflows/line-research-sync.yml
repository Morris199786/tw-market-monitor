name: LINE research sync (full history)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
  id-token: write
concurrency:
  group: line-research-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: id-tw-market-drive-reader@project-0c762295-9cd6-4a78-a63.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
      - run: python -m pip install requests
      - name: Build full research database (no AI, no Telegram)
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          LINE_EXPECTED_SERVICE_ACCOUNT: id-tw-market-drive-reader@project-0c762295-9cd6-4a78-a63.iam.gserviceaccount.com
        run: python scripts/sync_line_research.py
      - name: Commit full research and dedup audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reports_merged.json data/research_dedup_audit.json data/line_research.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update full LINE research database'
            git push
          fi
