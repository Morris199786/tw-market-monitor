name: Sync business reports index

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: business-reports-index
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly

      - name: Install PDF text extractor
        run: python -m pip install 'PyMuPDF>=1.24,<2'

      - name: Index Drive PDFs without AI
        id: index
        continue-on-error: true
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          BUSINESS_TEXT_SERVICE_URL: https://tw-market-research.morris860910.workers.dev
          MARKET_ASSISTANT_ADMIN_PASSWORD: ${{ secrets.MARKET_ASSISTANT_ADMIN_PASSWORD }}
        run: python scripts/update_business_reports.py

      - name: Commit public metadata only; PDF text stays private
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add data/business_reports.json

          if git diff --cached --quiet; then
            echo 'Business reports index unchanged.'
            exit 0
          fi

          git commit -m 'Update business reports index'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo 'Business reports index pushed successfully.'
              exit 0
            fi

            echo "Push conflict due to concurrent updates; retry ${attempt}/5"
            sleep 3
          done

          echo 'Unable to push after 5 attempts.' >&2
          exit 1

      - name: Report text sync failure after publishing PDF index
        if: steps.index.outcome == 'failure'
        run: |
          echo '::error::Original PDF index was preserved; inspect private text sync errors and rerun.'
          exit 1
