name: Sync business reports index
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
  id-token: write
concurrency:
  group: business-reports-index
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
      - name: Index Drive PDFs without AI
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python scripts/update_business_reports.py
      - name: Commit index only when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/business_reports.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update business reports index'
            git push
          fi
