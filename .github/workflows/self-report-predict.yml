name: Self Report Prediction
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 注意交易歷史起始日
        required: true
        default: '2026-07-01'
        type: string
      asof_date:
        description: 截止日（留空自動判斷）
        required: false
        default: ''
        type: string
      prediction_date:
        description: 目標交易日（留空自動判斷）
        required: false
        default: ''
        type: string
permissions:
  contents: write
concurrency:
  group: self-report-prediction
  cancel-in-progress: false
jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve dates
        id: dates
        env:
          INPUT_ASOF: ${{ inputs.asof_date }}
          INPUT_TARGET: ${{ inputs.prediction_date }}
        run: |
          python - <<'PY'
          import datetime as dt, os
          from zoneinfo import ZoneInfo
          now=dt.datetime.now(ZoneInfo('Asia/Taipei'))
          cutoff=os.environ['INPUT_ASOF'].strip()
          if not cutoff:
              cutoff=(now.date() if now.hour>=20 else now.date()-dt.timedelta(days=1)).isoformat()
          day=dt.date.fromisoformat(cutoff)
          if day>now.date() or (day==now.date() and now.hour<20):
              raise SystemExit('Attention data cutoff not complete')
          target=os.environ['INPUT_TARGET'].strip()
          if not target:
              target_day=day+dt.timedelta(days=1)
              while target_day.weekday()>=5:
                  target_day+=dt.timedelta(days=1)
              target=target_day.isoformat()
          if dt.date.fromisoformat(target)<=day:
              raise SystemExit('Target must follow cutoff')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'asof={cutoff}\ntarget={target}\n')
          print('asof',cutoff,'target',target,'prediction_always_runs',True)
          PY
      - name: Install dependencies
        run: python -m pip install numpy==2.1.3 scikit-learn==1.6.1 scipy==1.14.1 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Refresh website announcements without individual pushes
        env:
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
        run: |
          python -m pip install -r requirements.txt
          python scripts/update_self_reports.py
          python - <<'PY'
          import json, datetime as dt
          from zoneinfo import ZoneInfo
          h=json.load(open('data/self_reports_history.json'))
          s=json.load(open('data/self_reports.json'))
          stamp=dt.datetime.fromisoformat(h['updated_at'])
          now=dt.datetime.now(ZoneInfo('Asia/Taipei'))
          if stamp.tzinfo is None or not 0 <= (now-stamp).total_seconds() < 1800:
              raise SystemExit('Website history is stale')
          if not s.get('source_status',{}).get('mops',{}).get('ok'):
              raise SystemExit('MOPS collection incomplete; do not settle as zero actuals')
          PY
      - name: Ten-run reproducibility check and create prediction
        env:
          START_DATE: ${{ inputs.start_date }}
          ASOF_DATE: ${{ steps.dates.outputs.asof }}
          TARGET_DATE: ${{ steps.dates.outputs.target }}
        run: |
          python scripts/self_report_v17_determinism.py \
            --start "${START_DATE:-2026-07-01}" \
            --asof "$ASOF_DATE" --target "$TARGET_DATE" --runs 10
      - name: Settle using website's self-report history
        run: python scripts/self_report_v17_settle_actuals.py
      - name: Export forecast and prospective-only performance
        env:
          TARGET_DATE: ${{ steps.dates.outputs.target }}
        run: |
          python scripts/self_report_forecast_export.py \
            --target-date "$TARGET_DATE" \
            --predictions self_report_live/predictions.json \
            --ledger data/self_report_v17_forecast_ledger.json \
            --verified-actuals data/self_report_v17_actuals_verified.json \
            --output data/self_report_forecast.json
          python -m json.tool data/self_report_forecast.json >/dev/null
      - name: Prepare and send daily Telegram summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/self_report_daily_digest.py --send
      - name: Commit results
        if: ${{ !cancelled() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/self_report_forecast.json data/self_report_v17_forecast_ledger.json
          git add data/self_reports.json data/self_reports_history.json
          if test -f data/self_report_digest_sent.json; then git add data/self_report_digest_sent.json; fi
          if test -f data/self_report_v17_actuals_verified.json; then
            git add data/self_report_v17_actuals_verified.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'data: deterministic predictions and prospective settlement'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-report-v17-determinism
          path: |
            self_report_live/
            self_report_determinism/
          retention-days: 14

