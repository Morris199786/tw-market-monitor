name: Self Report Prediction
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 注意交易歷史起始日
        required: true
        default: '2026-09-01'
        type: string
      asof_date:
        description: 截止日期，留空使用昨日；當日尚未完成會自動排除
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: self-report-prediction
  cancel-in-progress: false
jobs:
  predict:
    name: Backtest and Predict
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run chronological prediction and backtest
        env:
          START_DATE: ${{ inputs.start_date }}
          ASOF_DATE: ${{ inputs.asof_date }}
        run: |
          python scripts/self_report_predict.py --backtest \
            --start "$START_DATE" --asof "$ASOF_DATE" \
            --reports data/self_reports_history.json --out self_report_model
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-report-prediction-results
          path: self_report_model/
          retention-days: 30
          if-no-files-found: warn
