name: Self Report Prediction
on:
  schedule:
    - cron: "30 13 * * 1-5" # 21:30 Asia/Taipei, weekdays
  workflow_dispatch:
    inputs:
      start_date:
        description: 注意交易歷史起始日
        required: true
        default: '2026-07-01'
        type: string
      asof_date:
        description: 截止日（留空自動判斷；當日需20:00後）
        required: false
        default: ''
        type: string
      prediction_date:
        description: 目標交易日（休市日需指定）
        required: false
        default: ''
        type: string
permissions:
  contents: write
concurrency:
  group: self-report-prediction
  cancel-in-progress: false
jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve dates
        id: dates
        env:
          INPUT_ASOF: ${{ inputs.asof_date }}
          INPUT_TARGET: ${{ inputs.prediction_date }}
        run: |
          python - <<'PY'
          import datetime as dt, os
          from zoneinfo import ZoneInfo
          now=dt.datetime.now(ZoneInfo('Asia/Taipei'))
          cutoff=os.environ['INPUT_ASOF'].strip()
          if not cutoff:
              cutoff=(now.date() if now.hour>=20 else now.date()-dt.timedelta(days=1)).isoformat()
          day=dt.date.fromisoformat(cutoff)
          if day>now.date() or (day==now.date() and now.hour<20):
              raise SystemExit('Attention data cutoff is not complete')
          target=os.environ['INPUT_TARGET'].strip()
          if not target:
              d=day+dt.timedelta(days=1)
              while d.weekday()>=5:d+=dt.timedelta(days=1)
              target=d.isoformat()
          if dt.date.fromisoformat(target)<=day:raise SystemExit('target must be later than cutoff')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'asof={cutoff}\ntarget={target}\n')
          print('cutoff',cutoff,'target',target)
          PY
      - name: Install dependencies
        run: python -m pip install numpy scikit-learn
      - name: Validate archived backtest inputs
        run: |
          test -s data/self_report_v17_archive/scores.csv
          test -s data/self_report_v17_archive/events.csv
      - name: Replay V17 archive July-October (same model scoring)
        run: |
          python scripts/self_report_predict.py --root . \
            --offline-scores data/self_report_v17_archive/scores.csv \
            --offline-events data/self_report_v17_archive/events.csv \
            --start 2026-07-01 --backtest-start 2026-07-23 --asof 2026-10-20 \
            --out self_report_archive
      - name: Generate live V17 prediction (separate from historical labels)
        env:
          START_DATE: ${{ inputs.start_date }}
          ASOF_DATE: ${{ steps.dates.outputs.asof }}
          TARGET_DATE: ${{ steps.dates.outputs.target }}
        run: |
          python scripts/self_report_predict.py --root . --start "$START_DATE" \
            --asof "$ASOF_DATE" --prediction-date "$TARGET_DATE" \
            --reports data/self_reports_history.json --out self_report_live
      - name: Settle forecasts from website self-report history
        run: |
          python scripts/self_report_v17_settle_actuals.py
      - name: Export prospective performance (10/21 onward)
        run: |
          python scripts/self_report_forecast_export.py \
            --predictions self_report_live/predictions.json \
            --summary self_report_archive/backtest_summary.json \
            --daily self_report_archive/backtest_daily.csv \
            --ledger data/self_report_v17_forecast_ledger.json \
            --verified-actuals data/self_report_v17_actuals_verified.json \
            --output data/self_report_forecast.json
          python -m json.tool data/self_report_forecast.json >/dev/null
      - name: Commit published JSON and immutable ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/self_report_forecast.json data/self_report_v17_forecast_ledger.json data/self_report_v17_actuals_verified.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update V17 forward predictions and website settlements'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-report-v17-verified-results
          path: |
            self_report_archive/
            self_report_live/
          retention-days: 30
