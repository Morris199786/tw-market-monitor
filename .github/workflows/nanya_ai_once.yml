name: Nanya Nov18 LINE recording AI (one-time)
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: research-report-processing
  cancel-in-progress: false
jobs:
  nanya_once:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set git identity and dependencies
        run: |
          python -m pip install requests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Check ONLY Nanya recording without API
        run: |
          python scripts/research_ai_batch.py --mode pending --limit 1 --category all --article-id line-721532f37b97fe8f4cbe --dry-run | tee /tmp/nanya-preview.log
          grep -q '"eligible": 1' /tmp/nanya-preview.log || { echo '::error::Nanya not uniquely eligible: cache, existing event, or filter; no API called'; exit 1; }
          grep -q 'line-721532f37b97fe8f4cbe' /tmp/nanya-preview.log
      - name: Parse ONLY Nanya once (durable checkpoint)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEARCH_AI_REMOTE_CHECKPOINT: '1'
          RESEARCH_AI_MODEL: gpt-5.6-luna
        run: |
          python scripts/research_ai_batch.py --mode pending --limit 1 --category all --article-id line-721532f37b97fe8f4cbe | tee /tmp/nanya-ai.log
          grep -q 'line-721532f37b97fe8f4cbe: success' /tmp/nanya-ai.log || { echo '::error::Nanya AI result not successful, inspect log'; exit 1; }
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: id-tw-market-drive-reader@project-0c762295-9cd6-4a78-a63.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
      - name: Read same Excel source for publication
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python - <<'PY'
          import os,json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from sync_line_research import fetch_sheet
          dest=Path(os.environ['RUNNER_TEMP'])/'research_sheet_nanya.json'
          dest.write_text(json.dumps(fetch_sheet(os.environ['ACCESS_TOKEN']),ensure_ascii=False),encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write(f'LINE_SYNC_FIXTURE={dest}\n')
          PY
      - name: Republish cached AI result (no additional API)
        run: |
          python scripts/sync_line_research.py
          python scripts/export_research_metrics.py
          git add -A -- data/research_shards data/research_search data/research_meta.json data/research_manifest.json data/research_dedup_audit.json data/research_financial_forecasts.json data/research_financial_backfill_report.json data/research_financial_by_id data/research_metrics.json data/research_ai_render.json data/research_ai_cache.json data/research_ai_batch_history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Nanya Nov18 AI research once'
            git fetch origin main
            git -c rebase.autoStash=true rebase origin/main
            git push origin HEAD:main
          fi
      - name: Confirm Nanya published
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          items=json.loads(Path('data/research_meta.json').read_text())
          n=[x for x in items if x.get('id')=='line-721532f37b97fe8f4cbe']
          if len(n)!=1 or not n[0].get('ai_processed'):
              raise SystemExit('NANYA_AI_NOT_PUBLISHED: inspect dedup/reused meeting records')
          print('NANYA_AI_PUBLISHED',n[0]['id'])
          PY
