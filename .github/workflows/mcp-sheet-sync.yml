name: Sync full Sheet for MCP

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["LINE research sync and incremental AI"]
    types: [completed]

permissions:
  contents: write
  id-token: write

concurrency:
  group: mcp-full-sheet
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly

      - name: Install dependencies
        run: python -m pip install requests 'PyMuPDF>=1.24,<2'

      - name: Sync all rows privately without AI
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          BUSINESS_TEXT_SERVICE_URL: https://tw-market-research.morris860910.workers.dev
          MARKET_ASSISTANT_ADMIN_PASSWORD: ${{ secrets.MARKET_ASSISTANT_ADMIN_PASSWORD }}
        run: python scripts/sync_mcp_sheet.py

