name: Test broker EPS from PDF

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Optional stock codes separated by comma (blank = all reports)'
        required: false
        default: ''
      limit:
        description: 'Number of PDF reports to test; 0 = ALL eligible PDFs'
        required: false
        default: '0'

permissions:
  contents: read
  id-token: write

jobs:
  test-pdf-eps:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate Google Drive read-only
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
      - name: Install PDF extractors
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python -m pip install requests pdfplumber
      - name: Run offline EPS parser regression tests
        run: python scripts/test_broker_eps_parser.py -v
      - name: Audit all eligible broker PDFs (no AI, no Telegram)
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          TEST_TICKERS: ${{ inputs.tickers }}
          TEST_LIMIT: ${{ inputs.limit }}
        run: python scripts/test_broker_eps_pdf.py --limit "$TEST_LIMIT" --tickers "$TEST_TICKERS"
      - name: Upload EPS audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-eps-pdf-all-results
          path: |
            data/broker_eps_pdf_test.json
            data/broker_eps_pdf_audit.json
          if-no-files-found: warn
          retention-days: 14
