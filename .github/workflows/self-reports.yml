name: Self reports update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: self-reports
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update self reports
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/update_self_reports.py

      - name: Update quarterly earnings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/update_quarterly_earnings.py

      - name: Commit updated data
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 先保存這次程式產生的所有資料變更
          git add \
            data/self_reports.json \
            data/self_reports_history.json \
            data/self_reports_sent.json \
            data/quarterly_earnings.json \
            data/quarterly_earnings_sent.json

          # 沒有資料變更就直接結束
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi

          git commit -m "data: self reports and quarterly earnings update"

          # Python 執行後若還有其他未追蹤/未 staged 的變更，
          # 先暫存，避免 git pull --rebase 因 dirty working tree 失敗
          git stash push --include-untracked -m "workflow-temp" || true

          # 處理 workflow 執行期間 main 被其他 Action 更新的情況
          git pull --rebase origin main

          # 推送本次資料
          git push origin HEAD:main

          # 清掉暫存；這些不是本 workflow 要提交的資料
          if git stash list | grep -q "workflow-temp"; then
            git stash drop
          fi
