name: Self reports update

on:
  workflow_dispatch:
    inputs:
      opm_backfill_only:
        description: '只補齊歷史 OPM（不重跑 EPS、毛利率或推播）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: self-reports
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect EPS news backup
        if: ${{ !inputs.opm_backfill_only }}
        continue-on-error: true
        run: python scripts/eps_news_backup.py

      - name: Update self reports
        if: ${{ !inputs.opm_backfill_only }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/update_self_reports.py

      - name: Update quarterly earnings
        if: ${{ !cancelled() && !inputs.opm_backfill_only }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/update_quarterly_earnings.py

      - name: Backfill historical OPM only
        if: ${{ !cancelled() && inputs.opm_backfill_only }}
        timeout-minutes: 30
        run: python scripts/quarterly_opm.py --full-backfill

      - name: Commit updated data
        if: ${{ !cancelled() }}
        env:
          OPM_BACKFILL_ONLY: ${{ inputs.opm_backfill_only }}
        run: python scripts/update_self_reports.py --commit-data


