name: Self reports update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: self-reports
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect EPS news backup
        continue-on-error: true
        run: python scripts/eps_news_backup.py

      - name: Update self reports
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/update_self_reports.py

      - name: Update quarterly earnings
        if: ${{ !cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/update_quarterly_earnings.py

      - name: Commit updated data
        if: ${{ !cancelled() }}
        run: python scripts/update_self_reports.py --commit-data

