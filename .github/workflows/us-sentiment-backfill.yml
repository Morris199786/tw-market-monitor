name: US Sentiment History Backfill (2011+)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us-sentiment-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check 'yfinance>=0.2.50,<2' 'pandas>=2.0,<3'
      - name: Download and verify IG and VIX alongside all prior historical sources
        run: python scripts/update_us_sentiment_history.py
      - name: Upload audit (even if source check fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-sentiment-fetch-audit
          path: data/us_sentiment_fetch_audit.json
          if-no-files-found: warn
      - name: Publish validated history JSON with concurrent-push retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Preserve validated output while updating the runner's checkout.
          cp data/us_sentiment_history.json "$RUNNER_TEMP/us_sentiment_history.validated.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            # The workflow runs in a disposable checkout. Resetting its branch
            # does not affect user commits or the other market-monitor files.
            git reset --hard origin/main
            cp "$RUNNER_TEMP/us_sentiment_history.validated.json" data/us_sentiment_history.json
            git add -- data/us_sentiment_history.json
            if git diff --cached --quiet; then
              echo 'US_SENTIMENT_UNCHANGED: current main already contains identical data'
              exit 0
            fi
            git commit -m 'data: complete IG history and VIX recent close'
            if git push origin HEAD:main; then
              echo 'US_SENTIMENT_PUBLISHED'
              exit 0
            fi
            echo "Concurrent update detected; retrying ($attempt/5)"
            sleep "$attempt"
          done
          echo 'ERROR: could not publish after 5 attempts' >&2
          exit 1
