name: Broker reports Drive inbox
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: research-report-processing
  cancel-in-progress: false
jobs:
  ingest-reports:
    runs-on: ubuntu-latest
    env:
      REPORT_AI_ROUTE: plan-first
      REPORT_PLAN_SSH_TARGET: ${{ secrets.REPORT_PLAN_SSH_TARGET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest processed state
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Connect report runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-reports
      - name: Check private ChatGPT report worker before claiming reports
        env:
          WORKER_KEY: ${{ secrets.REPORT_PLAN_SSH_KEY }}
          WORKER_HOST_KEY: ${{ secrets.REPORT_PLAN_KNOWN_HOSTS }}
        run: |
          set -eu
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$WORKER_KEY" > ~/.ssh/report_worker
          printf '%s\n' "$WORKER_HOST_KEY" >> ~/.ssh/known_hosts
          PYTHONPATH=scripts python -c 'from report_provider import plan_request; assert plan_request({"check": True}) == {"status": "ready"}'
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
      - name: Install document and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          python -m pip install pillow pillow-heif requests
      - name: Ingest new broker reports
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          DRIVE_FOLDER_ID: 1HCAfe0ohQIucD0ob3ziLI_JgePh0Uy9L
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REPORT_MODEL: gpt-5.6-luna
        run: python scripts/update_reports_drive.py
      - name: Extract Taiwan rating adjustments (original behavior)
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          DRIVE_FOLDER_ID: 1HCAfe0ohQIucD0ob3ziLI_JgePh0Uy9L
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REPORT_MODEL: gpt-5.6-luna
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_SITE_URL: https://morris199786.github.io/tw-market-monitor/
        run: python scripts/update_tw_ratings.py
      - name: Summarize reports, financial metrics and visuals in one pass
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REPORT_MODEL: gpt-5.6-luna
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_SITE_URL: https://morris199786.github.io/tw-market-monitor/
        run: python scripts/update_reports_ai_eps.py
      - name: Fix upgrade and downgrade classification
        run: python scripts/fix_report_actions.py
      - name: Commit report data (no second API request)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/report_inbox.json data/processed_reports.json data/reports.json data/report_company_registry.json data/tw_ratings.json data/tw_ratings_state.json
          if git diff --cached --quiet; then echo "No report changes"; exit 0; fi
          git commit -m "Update broker reports"
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          from update_reports_ai import push_report_commits
          push_report_commits()
          PY
