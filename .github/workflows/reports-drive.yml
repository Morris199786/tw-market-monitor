name: Broker reports Drive inbox

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: broker-reports-drive
  cancel-in-progress: false

jobs:
  ingest-reports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly

      - name: Install document and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          python -m pip install pillow pillow-heif

      - name: Ingest new broker reports
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          DRIVE_FOLDER_ID: 1HCAfe0ohQIucD0ob3ziLI_JgePh0Uy9L

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REPORT_MODEL: gpt-5.6-luna
        run: |
          python scripts/update_reports_drive.py

      - name: AI summarize and push broker reports
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REPORT_MODEL: gpt-5.6-luna

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          REPORT_SITE_URL: https://morris199786.github.io/tw-market-monitor/
        run: |
          python scripts/update_reports_ai.py

      - name: Commit report data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/report_inbox.json \
            data/processed_reports.json \
            data/reports.json

          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi

          git commit -m "Update broker reports"

          for i in 1 2 3; do
            git pull --rebase origin main && \
            git push origin HEAD:main && \
            break

            if [ "$i" = "3" ]; then
              echo "Push failed after 3 attempts"
              exit 1
            fi

            sleep 5
          done
