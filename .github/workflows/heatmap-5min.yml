name: Heatmap 5min

on:
  schedule:
    # GitHub 內建排程保留當備援
    # 台灣平日 09:00-13:59，每 5 分鐘
    - cron: "*/5 1-5 * * 1-5"

  repository_dispatch:
    types: [heatmap]

  workflow_dispatch:

permissions:
  contents: write

# 與 Daily close 共用同一把鎖
# Daily 在跑時 Heatmap 會排隊
# Heatmap 在跑時 Daily 也會排隊
concurrency:
  group: tw-market-data-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh master
        run: python scripts/update_master.py

      - name: Update heatmap
        run: python scripts/update_heatmap.py

      - name: Check new sector stocks and update stock detail
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          sectors_path = Path("data/sectors.json")
          detail_path = Path("data/stock_detail.json")

          with sectors_path.open(
              "r",
              encoding="utf-8",
          ) as f:
              sector_data = json.load(f)

          tracked = {
              str(stock.get("ticker") or "").strip()
              for sector in sector_data.get(
                  "sectors",
                  [],
              )
              for stock in sector.get(
                  "stocks",
                  [],
              )
              if str(
                  stock.get("ticker") or ""
              ).strip()
          }

          if detail_path.exists():
              with detail_path.open(
                  "r",
                  encoding="utf-8",
              ) as f:
                  detail_data = json.load(f)

              existing = set(
                  (
                      detail_data.get(
                          "stocks",
                          {},
                      )
                      or {}
                  ).keys()
              )
          else:
              existing = set()

          missing = sorted(
              tracked - existing
          )

          if missing:
              print(
                  "Missing stock detail:",
                  ", ".join(missing),
              )

              subprocess.check_call(
                  [
                      sys.executable,
                      "scripts/update_stock_detail.py",
                  ]
              )

              with detail_path.open(
                  "r",
                  encoding="utf-8",
              ) as f:
                  rebuilt = json.load(f)

              rebuilt_stocks = set(
                  (
                      rebuilt.get(
                          "stocks",
                          {},
                      )
                      or {}
                  ).keys()
              )

              still_missing = sorted(
                  tracked - rebuilt_stocks
              )

              if still_missing:
                  raise RuntimeError(
                      "stock_detail rebuild still missing: "
                      + ", ".join(still_missing)
                  )

              print(
                  "stock_detail rebuilt successfully"
              )

          else:
              print(
                  "stock_detail already contains all sector stocks"
              )
          PY

      - name: Commit updated data
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/heatmap-generated
          mkdir -p /tmp/heatmap-generated

          for file in \
            data/master.json \
            data/heatmap.json \
            data/stock_detail.json
          do
            if [ -f "$file" ]; then
              cp "$file" "/tmp/heatmap-generated/$(basename "$file")"
            fi
          done

          for attempt in 1 2 3 4 5
          do
            echo "======================================"
            echo "Push attempt ${attempt}/5"
            echo "======================================"

            git fetch origin main
            git reset --hard origin/main

            if [ -f /tmp/heatmap-generated/master.json ]; then
              cp /tmp/heatmap-generated/master.json data/master.json
            fi

            if [ -f /tmp/heatmap-generated/heatmap.json ]; then
              cp /tmp/heatmap-generated/heatmap.json data/heatmap.json
            fi

            if [ -f /tmp/heatmap-generated/stock_detail.json ]; then
              cp /tmp/heatmap-generated/stock_detail.json data/stock_detail.json
            fi

            git add \
              data/master.json \
              data/heatmap.json \
              data/stock_detail.json

            if git diff --cached --quiet; then
              echo "No heatmap changes"
              exit 0
            fi

            git commit -m "data: heatmap update"

            if git push origin HEAD:main; then
              echo "Heatmap data pushed successfully"
              exit 0
            fi

            echo "Remote main changed before push."
            echo "Retrying with latest main..."

            sleep 3
          done

          echo "Failed to push heatmap data after 5 attempts"
          exit 1
