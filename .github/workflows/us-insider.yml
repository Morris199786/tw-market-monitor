name: US Insider Monitor
on:
  workflow_dispatch:
    inputs:
      days:
        description: SEC filing lookback (days)
        default: '92'
        required: true
  pull_request:
    paths:
      - 'scripts/update_us_insider.py'
      - 'tests/test_us_insider.py'
      - '.github/workflows/us-insider.yml'
      - 'assets/us_insider.js'
permissions:
  contents: read
concurrency:
  group: us-insider-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests yfinance
      - run: python -m unittest discover -s tests -p test_us_insider.py
      - run: node --check assets/us_insider.js
  update:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests yfinance
      - name: Fetch SEC filings and calculate returns
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          LOOKBACK: ${{ inputs.days }}
        run: python scripts/update_us_insider.py --days "$LOOKBACK"
      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us_insider/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update US insider transactions"
          git push origin HEAD:"$GITHUB_REF_NAME"
