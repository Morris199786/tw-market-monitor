name: US Insider Monitor
on:
  workflow_dispatch:
    inputs:
      days:
        description: SEC filing lookback (days)
        default: '92'
        required: true
  pull_request:
    paths:
      - 'scripts/update_us_insider.py'
      - 'tests/test_us_insider.py'
      - '.github/workflows/us-insider.yml'
      - 'assets/us_insider.js'
permissions:
  contents: read
concurrency:
  group: us-insider-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests yfinance
      - run: python -m unittest discover -s tests -p test_us_insider.py
      - run: node --check assets/us_insider.js
  update:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/us-insider-monitor')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests yfinance
      - name: Fetch SEC filings and calculate returns
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT || format('tw-market-monitor research {0}/{1}', 'https://github.com', github.repository) }}
          LOOKBACK: ${{ inputs.days || '92' }}
        run: python scripts/update_us_insider.py --days "$LOOKBACK"
      - name: Check actual coverage
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/us_insider/latest.json'))
          print(d['coverage_note'])
          print('Purchase rows:',len(d['transactions']))
          print('Price histories:',len(d['prices']))
          assert d['transactions'], 'No purchase rows: cannot validate'
          assert d['prices'], 'No price histories: cannot validate'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: us-insider-live-data
          path: data/us_insider/latest.json
      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us_insider/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update US insider transactions"
          git push origin HEAD:"${{ github.head_ref || github.ref_name }}"
