name: AI paper portfolio
on:
  schedule:
    # Taiwan 22:30 and next trading morning 07:30.
    - cron: '30 14 * * 1-5'
    - cron: '30 23 * * 0-4'
  workflow_dispatch:
    inputs:
      retry_content_errors:
        description: '僅在上次內容分析失敗時勾選：重試失敗項，成功快取不重算'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: tw-market-data-writer
  cancel-in-progress: false
jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync current data
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Verify portfolio accounting
        run: python -m unittest discover -s tests -p 'test_ai*.py' -q
      - name: Refresh AI-only full-market quotes and official financials
        run: python scripts/collect_ai_universe.py
      - name: Restore independently saved research analysis
        uses: actions/cache/restore@v4
        with:
          path: .ai-content-cache/ai_research_content.json
          key: ai-content-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ai-content-v1-${{ github.ref_name }}-
      - name: Merge restored research cache
        run: python scripts/ai_content_research.py --restore-cache .ai-content-cache/ai_research_content.json
      - name: Interpret latest broker and meeting content (reuse evidence cache)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_CONTENT_RETRY_ERRORS: ${{ inputs.retry_content_errors }}
          AI_CONTENT_MODEL: ${{ vars.AI_CONTENT_MODEL }}
          OPENAI_REPORT_MODEL: ${{ vars.OPENAI_REPORT_MODEL }}
        run: python scripts/ai_content_research.py
      - name: Checkpoint research cache before portfolio publication
        if: always()
        run: |
          if [ -f data/ai_research_content.json ]; then
            mkdir -p .ai-content-cache
            cp data/ai_research_content.json .ai-content-cache/ai_research_content.json
          fi
      - name: Save research independently of Git push
        if: always() && hashFiles('.ai-content-cache/ai_research_content.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .ai-content-cache/ai_research_content.json
          key: ai-content-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep downloadable research recovery copy
        if: always() && hashFiles('.ai-content-cache/ai_research_content.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ai-research-content-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ai-content-cache/ai_research_content.json
          retention-days: 30
      - name: Process stored decisions and publish next target list
        run: python scripts/update_ai_portfolio.py
      - name: Commit AI account and caches without overwriting concurrent updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          owned_paths=(data/ai_research_content.json data/ai_portfolio.json data/ai_reference_manifest.json data/ai_market_snapshots data/ai_portfolio_archives data/ai_universe.json data/ai_fundamentals.json data/ai_universe_days data/ai_etf_bars)
          for path in "${owned_paths[@]}"; do
            if [ -e "$path" ]; then git add -- "$path"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          base_commit=$(git rev-parse HEAD)
          git commit -m 'data: advance AI paper portfolio'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            remote_commit=$(git rev-parse origin/main)
            if [ "$remote_commit" = "$base_commit" ]; then
              echo '::error::Push failed without a concurrent commit. Check the push error above; no data was overwritten.'
              exit 1
            fi
            if ! git diff --quiet "$base_commit" "$remote_commit" -- "${owned_paths[@]}"; then
              echo '::error::Another writer changed the AI account or its caches. Stopping rather than merging portfolio state; start a fresh workflow run.'
              exit 1
            fi
            # Refuse to publish scores computed from superseded website data.
            python - "$base_commit" "$remote_commit" <<'PYREF'
          import json, subprocess, sys
          refs=json.load(open('data/ai_reference_manifest.json',encoding='utf-8'))['files']
          changed=set(subprocess.check_output(['git','diff','--name-only',sys.argv[1],sys.argv[2]],text=True).splitlines())
          stale=sorted(changed.intersection(refs))
          from pathlib import Path
          Path('.ai-content-cache/stale-reference').write_text('1' if stale else '0')
          if stale:print('Reference changed; rescore against current main without repeating completed inference: '+', '.join(stale[:12]))
          PYREF
            # Only unrelated files changed remotely. Replay this AI-only commit on top.
            if ! git rebase origin/main; then
              git rebase --abort
              echo '::error::Rebase conflict. Existing remote files were preserved; start a fresh workflow run.'
              exit 1
            fi
            if [ "$(cat .ai-content-cache/stale-reference)" = "1" ]; then
              # Discard only this run's unpublished decision. Start from the actual
              # remote ledger; completed immutable content-cache keys are retained.
              if git cat-file -e origin/main:data/ai_portfolio.json 2>/dev/null; then
                git show origin/main:data/ai_portfolio.json > data/ai_portfolio.json
              else
                rm -f data/ai_portfolio.json
              fi
              python scripts/update_ai_portfolio.py
              for path in "${owned_paths[@]}"; do
                if [ -e "$path" ]; then git add -- "$path"; fi
              done
              git commit --amend --no-edit
            fi
            base_commit=$remote_commit
          done
          echo '::error::Concurrent updates exceeded retry limit; remote data was preserved.'
          exit 1
      - name: Report actual portfolio status
        run: |
          python - <<'PY'
          import json, os
          d=json.load(open('data/ai_portfolio.json',encoding='utf-8'))
          a=d.get('latest_attempt',{})
          last=(d.get('decisions') or [{}])[-1]
          lines=['AI paper portfolio',f"Status: {d.get('status')}",f"Capital: {d['config']['initial_cash']:,.0f}",f"Decision date: {last.get('date','not published')}",f"Targets: {len(last.get('targets',[]))}",f"Decision revision: {last.get('revision',1)}",f"Holder date: {last.get('sources',{}).get('holder_date')}",f"Reference hash: {last.get('reference_hash','legacy')}",f"Actual positions: {len(d.get('positions',{}))}",f"Coverage: {json.dumps(a.get('coverage',{}),ensure_ascii=False)}"]
          lines.extend([f"Published: {bool(a.get('valid'))}",f"Published at: {last.get('available_at','none')}",f"Model: {last.get('model','none')}"])
          for warning in a.get('warnings',[]):
              print('::warning::'+warning.replace('\n',' '))
              lines.append(warning)
          for error in a.get('errors',[]):
              print('::warning::'+error.replace('\n',' '))
              lines.append('Data pending: '+error)
          print('\n'.join(lines))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('\n\n'.join(lines)+'\n')
          if not a.get('valid'):raise SystemExit('本次未發布有效名單，資料狀態已保存至網站；不以綠勾表示發布完成')
          PY
