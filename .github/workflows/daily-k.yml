name: Daily K charts
on:
  workflow_dispatch:
  schedule:
    - cron: '20 10 * * 1-5'
permissions:
  contents: write
concurrency:
  group: daily-k
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Update daily candles
        run: python scripts/update_daily_k.py
      - name: Save valid candles and source status
        if: ${{ !cancelled() }}
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ ! -d data/daily_k ]; then exit 0; fi
          git add data/daily_k
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: daily K charts'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
