name: Self Report Historical Backtest

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '注意交易資料起點（用於回看）'
        required: true
        default: '2026-07-01'
        type: string
      backtest_start:
        description: '回測起始日'
        required: true
        default: '2026-07-23'
        type: string
      end_date:
        description: '回測截止日'
        required: true
        default: '2026-10-20'
        type: string

permissions:
  contents: read

concurrency:
  group: self-report-historical-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model dependencies
        run: python -m pip install numpy==2.1.3 scikit-learn==1.6.1 scipy==1.14.1 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Replay current website model across historical sessions
        env:
          START_DATE: ${{ inputs.start_date }}
          BACKTEST_START: ${{ inputs.backtest_start }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          python scripts/self_report_predict.py \
            --root . \
            --start "${START_DATE:-2026-07-01}" \
            --backtest-start "${BACKTEST_START:-2026-07-23}" \
            --asof "${END_DATE:-2026-10-20}" \
            --reports data/self_reports_history.json \
            --out self_report_historical_backtest \
            --attention-cache self_report_historical_backtest/attention_cache \
            --backtest
      - name: Check and show results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('self_report_historical_backtest/backtest_summary.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          print('MODEL_VERSION',x.get('version'))
          print('EVALUATED_DAYS',x.get('evaluated_days'))
          print('DATA_ASOF',x.get('asof'))
          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']),'a',encoding='utf-8') as f:
            f.write('\n## 2026/7–10 自結預測歷史回測（網站目前模型）\n\n')
            f.write('上市：Rule A；上櫃：原版 V17。此為歷史回放，不是 10/21 起的前瞻驗證。\n\n')
            f.write('| 市場 | 推薦次數 | 命中次數 | 實際自結 | Precision | Recall |\n|---|---:|---:|---:|---:|---:|\n')
            for k,n in [('twse','上市 A'),('tpex','上櫃 V17'),('model','合計')]:
              v=x.get(k,{})
              fmt=lambda z: '—' if z is None else f'{z:.2%}'
              f.write(f"| {n} | {v.get('predictions','—')} | {v.get('hits','—')} | {v.get('actual','—')} | {fmt(v.get('precision'))} | {fmt(v.get('recall'))} |\n")
            f.write('\n⚠️ 歷史公告標籤如有缺漏，命中率與召回率可能偏差；需核對封存 events.csv。\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-report-historical-backtest
          path: self_report_historical_backtest/
          retention-days: 30
