name: Self Report Historical Backtest
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: restored-self-report-historical-backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Freeze original model and FULL historical inputs
        uses: actions/checkout@v4
        with:
          ref: 860ef3a9a011faf9a821ad128524e21d50ce29cf
          path: _historical_source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse official attention cache
        uses: actions/download-artifact@v4
        with:
          name: self-report-historical-backtest
          run-id: 39553539254
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _historical_notice_archive
      - name: Download original comparison for exact daily verification
        uses: actions/download-artifact@v4
        with:
          name: self-report-rule-v17-comparison
          run-id: 39544035888
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _historical_reference
      - name: Offline replay with restored archive and unchanged models
        run: |
          python scripts/self_report_historical_backtest.py \
            --source-root _historical_source \
            --notice-cache _historical_notice_archive/attention_cache \
            --reference _historical_reference/private_rule_v17_compare/comparison_daily.csv \
            --out self_report_historical_backtest
      - uses: actions/upload-artifact@v4
        with:
          name: self-report-historical-backtest-restored
          path: self_report_historical_backtest/
          retention-days: 30
          if-no-files-found: error
