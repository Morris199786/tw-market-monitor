name: Self Report Historical Backtest
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Attention data start'
        required: true
        default: '2026-07-01'
        type: string
      backtest_start:
        description: 'Backtest first trading day'
        required: true
        default: '2026-07-23'
        type: string
      end_date:
        description: 'Backtest end'
        required: true
        default: '2026-10-20'
        type: string
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy==2.1.3 scikit-learn==1.6.1 scipy==1.14.1 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Backtest Rule A and original OTC
        env:
          START_DATE: ${{ inputs.start_date }}
          BACKTEST_START: ${{ inputs.backtest_start }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          python scripts/self_report_historical_backtest.py --root . --start "$START_DATE" --backtest-start "$BACKTEST_START" --end "$END_DATE"
      - name: Verify requested date and publish summary
        run: |
          python - <<'PY2'
          import json, os
          from pathlib import Path
          x=json.loads(Path('self_report_historical_backtest/backtest_summary.json').read_text())
          assert x['first_evaluated_date']=='2026-07-23', x['first_evaluated_date']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write(f"## 回測 {x['first_evaluated_date']} ~ {x['last_evaluated_date']} ({x['evaluated_days']} 天)\n\n")
            f.write('| 市場 | 推薦 | 命中 | 實際 | Precision | Recall |\n|---|---:|---:|---:|---:|---:|\n')
            for k,label in [('twse','上市 A'),('tpex','上櫃 V17'),('model','合計')]:
              a=x[k]
              fmt=lambda v: '—' if v is None else f'{v:.2%}'
              f.write(f"| {label} | {a['predictions']} | {a['hits']} | {a['actual']} | {fmt(a['precision'])} | {fmt(a['recall'])} |\n")
          PY2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-report-historical-backtest
          path: self_report_historical_backtest/
          retention-days: 30
