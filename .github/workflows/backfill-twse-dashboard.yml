name: Backfill TWSE dashboard credit risk (2026-09-23 onward)
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start yyyy-mm-dd'
        required: false
        default: '2026-09-23'
      end_date:
        description: 'End yyyy-mm-dd, blank for today'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: tw-market-monitor-update
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official date-scoped credit JSON (cards + history metrics, no Chromium required)
        id: collect
        continue-on-error: true
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$END_DATE" ]; then
            python scripts/update_twse_credit_dashboard.py --backfill --start "$START_DATE" --end "$END_DATE"
          else
            python scripts/update_twse_credit_dashboard.py --backfill --start "$START_DATE"
          fi
      - name: Publish verified historical records even if some dates unavailable
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/twse_credit_dashboard.json
          if git diff --cached --quiet; then echo 'TWSE_BACKFILL_NO_CHANGE'; exit 0; fi
          git commit -m 'data: verified TWSE credit dashboard backfill'
          for n in 1 2 3 4 5; do
            git fetch origin main
            git -c rebase.autoStash=true rebase origin/main
            if git push origin HEAD:main; then echo 'TWSE_BACKFILL_PUBLISHED'; exit 0; fi
            sleep "$n"
          done
          exit 1
      - name: Final backfill status
        if: ${{ always() }}
        run: |
          echo 'Collector outcome: ${{ steps.collect.outcome }}'
          echo 'Missing dates are not fabricated. The collector prints all gaps in TWSE_CREDIT_SUMMARY.'
          if test '${{ steps.collect.outcome }}' != 'success'; then exit 1; fi
