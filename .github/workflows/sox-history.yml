name: SOX history backfill
on:
  workflow_dispatch:
  # Optional daily refresh: uncomment after verifying first backfill.
  # schedule:
  #   - cron: '10 0 * * 2-6'
permissions:
  contents: write
concurrency:
  group: sox-history-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install 'yfinance>=0.2.54,<2' 'pandas-market-calendars>=5,<6' 'requests>=2.32,<3'
      - name: Fetch and validate
        run: python scripts/backfill_sox_history.py
      - name: Preserve archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sox-history
          path: data/history/sox-history.json
      - name: Commit verified archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/history/sox-history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update verified SOX historical prices'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
