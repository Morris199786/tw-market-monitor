name: Test sales reports Drive access

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-access:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate with existing Google service account
        uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly

      - name: Test new Drive folder and PDF access (read-only)
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          API = "https://www.googleapis.com/drive/v3/files"
          FOLDER = "1CLtRfuqr9uC_Sak0VSgYdlhogzG8K2ma"
          SAMPLE = "16aZebvJpxdJvuh62z-y0P9rJ4OvDBeZw"
          TOKEN = os.environ["ACCESS_TOKEN"]

          def request(path, params=None, binary=False):
              url = API + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(
                  url, headers={"Authorization": "Bearer " + TOKEN}
              )
              try:
                  with urllib.request.urlopen(req, timeout=40) as response:
                      if binary:
                          return response.read(16)
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read(500).decode("utf-8", "replace")
                  print(f"FAILED HTTP {exc.code}: {body}")
                  sys.exit(1)

          print("1/3 Check folder metadata")
          folder = request("/" + FOLDER, {"fields": "id,name,mimeType"})
          print("Folder:", folder.get("name"))

          print("2/3 List PDFs in folder")
          listing = request("", {
              "q": f"'{FOLDER}' in parents and trashed = false and mimeType = 'application/pdf'",
              "fields": "nextPageToken,files(id,name,mimeType)",
              "pageSize": 100,
          })
          files = listing.get("files", [])
          print("PDFs on first page:", len(files))
          print("Has next page:", bool(listing.get("nextPageToken")))
          for item in files[:5]:
              print(" -", item["name"])
          if not files:
              print("FAILED: No PDFs returned. Verify service account folder permissions.")
              sys.exit(1)

          print("3/3 Download sample PDF bytes")
          metadata = request("/" + SAMPLE, {"fields": "id,name,mimeType,size"})
          print("Sample:", metadata.get("name"))
          signature = request("/" + SAMPLE, {"alt": "media"}, binary=True)
          if not signature.startswith(b"%PDF-"):
              print("FAILED: Downloaded content is not a PDF")
              sys.exit(1)

          print("PASS: GitHub service account can list new folder and read PDF")
          PY
