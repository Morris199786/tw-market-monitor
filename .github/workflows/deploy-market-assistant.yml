name: Deploy market research connection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-research-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deploy isolated read-only research service
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MARKET_ASSISTANT_PASSWORD: ${{ secrets.MARKET_ASSISTANT_PASSWORD }}
        run: node assistant-mcp/deploy.mjs
