      - name: Commit updated data
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Saving generated data..."

          rm -rf /tmp/generated-data
          mkdir -p /tmp/generated-data

          cp -a data/. /tmp/generated-data/

          success=false

          for i in 1 2 3 4 5; do
            echo "======================================"
            echo "Push attempt $i/5"
            echo "======================================"

            #
            # 重新取得目前 GitHub 最新 main
            #
            git fetch origin main

            #
            # 直接回到最新 main
            #
            # 不做 merge
            # 不做 rebase
            # 所以不會產生 heatmap.json conflict
            #
            git reset --hard origin/main

            #
            # 把這次 Daily 剛產生的資料
            # 蓋回最新 main
            #
            rm -rf data
            mkdir -p data

            cp -a /tmp/generated-data/. data/

            #
            # 重新建立 commit
            #
            git add data

            if git diff --cached --quiet; then
              echo "No data changes"
              success=true
              break
            fi

            git commit -m "data: daily close update"

            #
            # 嘗試 push
            #
            if git push origin HEAD:main; then
              echo "Push successful"
              success=true
              break
            fi

            echo "Remote changed during push."
            echo "Retrying with latest main..."

            #
            # 下一輪重新抓最新 main
            #
            sleep 3
          done

          if [ "$success" != "true" ]; then
            echo "Push failed after 5 attempts"
            exit 1
          fi
