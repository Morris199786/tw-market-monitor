name: Daily close update

on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "20 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tw-market-data-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run daily update
        id: daily
        continue-on-error: true
        run: python scripts/update_all.py
      - name: Commit updated data even if AI selection failed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/generated-data
          mkdir -p /tmp/generated-data
          cp -a data/. /tmp/generated-data/
          success=false
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf data
            mkdir -p data
            cp -a /tmp/generated-data/. data/
            git add data
            if git diff --cached --quiet; then
              echo "No data changes"
              success=true
              break
            fi
            git commit -m "data: daily close update"
            if git push origin HEAD:main; then
              success=true
              break
            fi
            sleep 3
          done
          if [ "$success" != "true" ]; then
            echo "::error::Could not push daily data after five attempts"
            exit 1
          fi
      - name: Report partial update failure
        if: steps.daily.outcome == 'failure'
        run: |
          echo "::error::One or more update scripts failed. Successful data was committed; inspect Run daily update for details."
          exit 1
