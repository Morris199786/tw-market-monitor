name: Daily close update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tw-market-data-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily update
        run: python scripts/update_all.py

      - name: Commit updated data
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Saving generated data..."

          rm -rf /tmp/generated-data
          mkdir -p /tmp/generated-data

          cp -a data/. /tmp/generated-data/

          success=false

          for i in 1 2 3 4 5; do
            echo "======================================"
            echo "Push attempt $i/5"
            echo "======================================"

            #
            # 取得目前 GitHub 最新 main
            #
            git fetch origin main

            #
            # 回到最新 main
            #
            # 不 merge
            # 不 rebase
            #
            git reset --hard origin/main

            #
            # 把這次 Daily 產生的資料
            # 蓋回最新 main
            #
            rm -rf data
            mkdir -p data

            cp -a /tmp/generated-data/. data/

            #
            # 建立 commit
            #
            git add data

            if git diff --cached --quiet; then
              echo "No data changes"
              success=true
              break
            fi

            git commit -m "data: daily close update"

            #
            # Push
            #
            if git push origin HEAD:main; then
              echo "Push successful"
              success=true
              break
            fi

            echo "Remote changed during push."
            echo "Retrying with latest main..."

            sleep 3
          done

          if [ "$success" != "true" ]; then
            echo "Push failed after 5 attempts"
            exit 1
          fi
