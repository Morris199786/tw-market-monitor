name: Daily close update

on:
  workflow_dispatch:

permissions:
  contents: write

# 所有會寫入市場資料的 workflow 共用同一把鎖
# 避免 Daily close 與 Heatmap 同時修改 heatmap.json
concurrency:
  group: tw-market-data-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily update
        run: python scripts/update_all.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data

          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi

          git commit -m "data: daily close update"

          git push origin HEAD:main
