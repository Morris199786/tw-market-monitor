name: Daily close update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-close
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture previous data dates
        id: before
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          files = {
              "flows_date": "data/institutional.json",
              "volume_date": "data/volume.json",
              "turnover_date": "data/turnover.json",
          }

          for key, path in files.items():
              try:
                  data = json.loads(
                      Path(path).read_text(
                          encoding="utf-8"
                      )
                  )
                  value = str(
                      data.get("date") or ""
                  )
              except Exception:
                  value = ""

              print(f"{key}={value}")
          PY

      - name: Run daily update
        run: python scripts/update_all.py

      - name: Detect new trading-date data
        id: changed
        shell: bash
        env:
          OLD_FLOWS_DATE: ${{ steps.before.outputs.flows_date }}
          OLD_VOLUME_DATE: ${{ steps.before.outputs.volume_date }}
          OLD_TURNOVER_DATE: ${{ steps.before.outputs.turnover_date }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          checks = {
              "flows": (
                  "data/institutional.json",
                  os.environ.get(
                      "OLD_FLOWS_DATE",
                      "",
                  ),
              ),
              "volume": (
                  "data/volume.json",
                  os.environ.get(
                      "OLD_VOLUME_DATE",
                      "",
                  ),
              ),
              "turnover": (
                  "data/turnover.json",
                  os.environ.get(
                      "OLD_TURNOVER_DATE",
                      "",
                  ),
              ),
          }

          for key, (path, old_date) in checks.items():
              try:
                  data = json.loads(
                      Path(path).read_text(
                          encoding="utf-8"
                      )
                  )

                  new_date = str(
                      data.get("date")
                      or ""
                  )
              except Exception:
                  new_date = ""

              changed = bool(
                  new_date
                  and new_date != old_date
              )

              print(
                  f"{key}="
                  f"{'true' if changed else 'false'}"
              )

              print(
                  f"{key}_date="
                  f"{new_date}"
              )

              print(
                  f"{key}: "
                  f"old={old_date or '-'} "
                  f"new={new_date or '-'} "
                  f"notify={changed}"
              )
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data

          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi

          git commit -m "data: daily close update"

          success=false

          for i in 1 2 3 4 5; do
            echo "Push attempt $i/5"

            if ! git pull --rebase origin main; then
              echo "Rebase failed"
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              success=true
              break
            fi

            echo "Remote changed before push, retrying..."
            sleep 5
          done

          if [ "$success" != "true" ]; then
            echo "Push failed after 5 attempts"
            exit 1
          fi

      - name: Telegram - 籌碼日報
        if: steps.changed.outputs.flows == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_SITE_URL: https://morris199786.github.io/tw-market-monitor/
        run: python scripts/send_update_telegram.py flows

      - name: Telegram - 突然放量
        if: steps.changed.outputs.volume == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_SITE_URL: https://morris199786.github.io/tw-market-monitor/
        run: python scripts/send_update_telegram.py volume

      - name: Telegram - 成交排行
        if: steps.changed.outputs.turnover == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_SITE_URL: https://morris199786.github.io/tw-market-monitor/
        run: python scripts/send_update_telegram.py turnover
