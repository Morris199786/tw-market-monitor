name: Daily close update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-close
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily update
        run: python scripts/update_all.py

      - name: Detect page changes
        id: changed
        shell: bash
        run: |
          if git diff --quiet -- data/institutional.json; then
            echo "flows=false" >> "$GITHUB_OUTPUT"
          else
            echo "flows=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet -- data/volume.json; then
            echo "volume=false" >> "$GITHUB_OUTPUT"
          else
            echo "volume=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet -- data/turnover.json; then
            echo "turnover=false" >> "$GITHUB_OUTPUT"
          else
            echo "turnover=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data

          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi

          git commit -m "data: daily close update"
          git pull --rebase
          git push

      - name: Telegram - 籌碼日報
        if: steps.changed.outputs.flows == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_SITE_URL: https://morris199786.github.io/tw-market-monitor/
        run: python scripts/send_update_telegram.py flows

      - name: Telegram - 突然放量
        if: steps.changed.outputs.volume == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_SITE_URL: https://morris199786.github.io/tw-market-monitor/
        run: python scripts/send_update_telegram.py volume

      - name: Telegram - 成交排行
        if: steps.changed.outputs.turnover == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_SITE_URL: https://morris199786.github.io/tw-market-monitor/
        run: python scripts/send_update_telegram.py turnover
