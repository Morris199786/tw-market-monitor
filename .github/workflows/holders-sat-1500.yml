name: Weekly holders

on:
  schedule:
    # GitHub 內建排程保留當備援
    # 台灣週六 17:00 = UTC 09:00
    - cron: "0 9 * * 6"

    # 台灣週六 17:20
    - cron: "20 9 * * 6"

  # Cloudflare Cron 主排程
  repository_dispatch:
    types: [holders]

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-holders
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update master
        run: python scripts/update_master.py

      - name: Update holders
        run: python scripts/update_holders.py

      - name: Update AI picks
        run: python scripts/update_ai.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data

          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi

          git commit -m "data: weekly holders update"

          git pull --rebase

          git push
