name: Self Report Historical Backtest
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: self-report-history-backtest
  cancel-in-progress: false
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch September MOPS self reports into isolated file
        run: python scripts/self_report_history_backfill.py --start 2026-09-01 --end 2026-09-28 --out self_report_historical
      - name: Fixed rules retrospective test (not independent out-of-sample)
        run: |
          python scripts/self_report_predict.py --backtest --start 2026-08-01 --asof 2026-09-29 --backtest-start 2026-09-01 --reports self_report_historical/self_reports_history.json --out self_report_historical/model
      - name: Upload historical results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-report-historical-backtest
          path: self_report_historical/
          retention-days: 30
