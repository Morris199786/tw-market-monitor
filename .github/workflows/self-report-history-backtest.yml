name: Self Report Historical Backtest
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: self-report-history-backtest
  cancel-in-progress: false
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Reuse archived historical MOPS data
        uses: actions/download-artifact@v4
        with:
          name: self-report-historical-backtest
          run-id: 39398945984
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: self_report_historical
      - name: Verify archive
        run: |
          test -s self_report_historical/model/walk_forward_scores.csv
          test -s self_report_historical/model/event_audit.csv
          test -s data/self_reports_history.json
      - name: Extend from repository reports and cache notices then backtest to Oct 19
        run: |
          python scripts/self_report_predict.py \
            --extend-archive --backtest --start 2026-09-01 \
            --backtest-start 2026-07-01 --asof 2026-10-19 \
            --offline-scores self_report_historical/model/walk_forward_scores.csv \
            --offline-events self_report_historical/model/event_audit.csv \
            --out self_report_historical/model
      - name: Upload historical results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-report-historical-backtest-updated
          path: self_report_historical/
          retention-days: 30
