name: Self Report Historical Backtest
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: self-report-history-backtest
  cancel-in-progress: false
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Reuse archived historical MOPS data (no re-fetch)
        uses: actions/download-artifact@v4
        with:
          name: self-report-historical-backtest
          run-id: 39398945984
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: self_report_historical
      - name: Verify offline historical archive is present
        run: |
          test -s self_report_historical/model/walk_forward_scores.csv
          test -s self_report_historical/model/event_audit.csv
          test -s self_report_historical/self_reports_history.json
          python - <<'PY'
          import json
          p='self_report_historical/self_reports_history.json'
          d=json.load(open(p,encoding='utf-8-sig'))
          assert d.get('items'), 'Historical events missing'
          print('Reused',len(d['items']),'archived MOPS records')
          PY
      - name: Offline chronological backtest (zero HTTP requests)
        run: |
          python scripts/self_report_predict.py --backtest --asof 2026-09-29 --backtest-start 2026-07-01 --offline-scores self_report_historical/model/walk_forward_scores.csv --offline-events self_report_historical/model/event_audit.csv --out self_report_historical/model
      - name: Upload historical results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-report-historical-backtest-updated
          path: self_report_historical/
          retention-days: 30
