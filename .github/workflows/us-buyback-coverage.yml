name: US Buyback Coverage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/us-buyback-coverage.yml'
      - 'scripts/update_us_buybacks.py'
permissions:
  contents: write
concurrency:
  group: us-ownership-research
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Collect and verify
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
        run: |
          cp data/us_insider/buybacks.json /tmp/buybacks-prior.json
          python -m py_compile scripts/update_us_buybacks.py scripts/us_buyback_filing.py scripts/us_buyback_verify.py
          python tests/test_us_buyback_verify.py
          python scripts/update_us_buybacks.py
          python - <<'PY'
          import json
          from collections import Counter
          old=json.load(open('/tmp/buybacks-prior.json'))
          new=json.load(open('data/us_insider/buybacks.json'))
          assert set(old['coverage']) <= set(new['coverage'])
          assert {t for t,v in old['coverage'].items() if v=='tagged'} <= {t for t,v in new['coverage'].items() if v=='tagged'}
          assert new['rows']
          assert set(new['filing_audit']) == set(new['coverage'])
          assert new['verification']['summary']['issuers'] == len(new['coverage'])
          print('Verification:', new['verification']['summary'])
          print('Filing audit:', Counter(new['filing_audit'].values()))
          print(Counter(new['coverage'].values()))
          print('Remaining:', [t for t,v in new['coverage'].items() if v!='tagged'])
          PY
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us_insider/buybacks.json
          git diff --cached --quiet && exit 0
          git commit -m "Update expanded buyback coverage"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
