name: Market monitor
on:
  schedule:
    - cron: '15 10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tw-market-data-writer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update monitor
        run: python scripts/update_market_monitor.py
      - name: Save monitor data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market_monitor.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: market monitor'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
