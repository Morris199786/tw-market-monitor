name: Market monitor
on:
  schedule:
    - cron: '15 10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tw-market-monitor-update
  cancel-in-progress: false
  queue: max
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update US monitor
        run: python scripts/update_us_market_monitor.py
      - name: Update monitor
        if: ${{ !cancelled() }}
        run: python scripts/update_market_monitor.py
      - id: breadth-cache
        uses: actions/cache/restore@v4
        if: ${{ !cancelled() }}
        with:
          path: .cache/market-breadth-v1
          key: market-breadth-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: market-breadth-v1-
      - name: Update market breadth
        if: ${{ !cancelled() }}
        run: python scripts/update_market_breadth.py
      - name: Save downloaded breadth history
        if: ${{ !cancelled() && steps.breadth-cache.outputs.cache-hit != 'true' && hashFiles('.cache/market-breadth-v1/**') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/market-breadth-v1
          key: market-breadth-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save monitor data
        if: ${{ always() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f data/market_breadth.json ]; then git add data/market_breadth.json; fi
          git add data/market_monitor.json
          if [ -f data/us_market_monitor.json ]; then git add data/us_market_monitor.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: market monitor'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
