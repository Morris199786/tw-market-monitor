name: Publish broker EPS comparison
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_shared_financial.py'
      - 'scripts/shared_financial_catalog.py'
      - 'scripts/shared_financial_shadow_compare.py'
      - 'scripts/shared_actual_eps.py'
      - '.github/workflows/broker-eps-comparison.yml'
  workflow_run:
    workflows: ["Broker reports Drive inbox", "Sync business reports index and Codex analysis", "Self reports update"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: broker-eps-comparison-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate offline EPS modules (no legacy PDF tests)
        run: |
          python -m py_compile scripts/broker_eps_fallback.py scripts/broker_eps_pipeline.py scripts/broker_eps_compare.py scripts/broker_eps_safe_publish.py
          PYTHONPATH=scripts python - <<'PY'
          from broker_eps_pipeline import normalize, publish_new, ai_eps_rows
          from broker_eps_compare import compare
          from broker_eps_safe_publish import main
          assert normalize([{'period':'2026-Q3','eps':1.25}]) == [{'period':'2026-Q3','eps':1.25}]
          assert ai_eps_rows({'financial_forecasts':[{'period':'2027-Q1','metric':'eps','value':2.5,'type':'forecast','source':'broker'},{'period':'2027','metric':'eps','value':42.1,'type':'forecast','source':'broker'},{'period':'2027-Q2','metric':'eps','value':99,'type':'forecast','source':'consensus'}]})[0] == [{'period':'2027-Q1','eps':2.5}]
          print('Offline AI forecast publication validated; no API calls or PDF reparse')
          PY
      - name: Test margin extraction and OPM source
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p test_broker_margin_regression.py
      - name: Refuse unsealed baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/broker_eps_baseline_sealed.json')
          if not p.exists() or not json.loads(p.read_text()).get('sealed'):
              raise SystemExit('Baseline not sealed: run the one-time seal workflow before enabling publication')
          PY
      - name: Publish EPS data offline (zero API calls, zero PDF reparse)
        run: python scripts/broker_eps_safe_publish.py
      - name: Validate and publish shared financial catalog
        run: |
          PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_shared_*.py'
          python scripts/publish_shared_financial.py --output data
      - name: Verify shared catalog and preserve legacy comparisons
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('data/shared_financial_v1.json').read_text())
          assert j['schema']==1 and j['items']
          assert all(r['source']=='broker' for r in j['items'])
          assert j['comparison_mode']=='production'
          facts={(r['report_id'],r['ticker'],r['period'],r['metric'],r['value']) for r in j['items']}
          for metric,rows in j['comparisons'].items():
              assert all((r['report_id'],r['ticker'],r['period'],metric,r['forecast_'+metric]) in facts for r in rows)
          PY
      - name: Commit only changed financial data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/broker_eps_forecasts.json data/broker_eps_processed.json data/broker_eps_review_queue.json data/broker_eps_comparisons.json data/broker_gross_margin_comparisons.json data/broker_operating_margin_comparisons.json data/broker_eps_compare_audit.json data/shared_financial_v1.json data/shared_financial_status.json
          if git diff --cached --quiet; then echo 'No EPS changes'; exit 0; fi
          git commit -m 'Publish broker comparisons and shared financial catalog offline'
          # The publisher may touch other tracked files. Those uncommitted
          # changes must not block rebase or accidentally enter the commit.
          git restore --worktree .
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Rebase conflict; refusing to overwrite upstream changes'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
