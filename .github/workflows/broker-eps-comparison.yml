name: Publish broker EPS comparison

on:
  workflow_dispatch:
  schedule:
    # 19:15 Asia/Taipei every day, after the 18:00 broker report roundup.
    - cron: '15 11 * * *'
  workflow_run:
    workflows: ["Broker reports Drive inbox"]
    types: [completed]

permissions:
  contents: write
  id-token: write

concurrency:
  group: broker-eps-comparison-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate Google Drive read-only
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
      - name: Install offline PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python -m pip install requests pdfplumber
      - name: Test EPS parser
        run: python scripts/test_broker_eps_parser.py -v
      - name: Extract broker EPS (no AI or Telegram)
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python scripts/test_broker_eps_pdf.py --limit 0
      - name: Publish forecasts and install UI
        run: |
          python scripts/publish_broker_eps_comparison.py
          python scripts/install_broker_eps_comparison.py
      - name: Commit only comparison data and UI registration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/broker_eps_forecasts.json index.html
          if git diff --cached --quiet; then
            echo 'No comparison changes'
            exit 0
          fi
          git commit -m 'Update broker EPS comparison data'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
