name: Publish broker EPS comparison
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:
    workflows: ["Broker reports Drive inbox"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: broker-eps-comparison-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test offline EPS modules
        run: python -m unittest discover -s scripts -p 'test_broker_eps_*.py' -v
      - name: Refuse unsealed baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/broker_eps_baseline_sealed.json')
          if not p.exists() or not json.loads(p.read_text()).get('sealed'):
              raise SystemExit('Baseline not sealed: run the one-time seal workflow before enabling publication')
          PY
      - name: Publish EPS data offline (zero API calls, zero PDF reparse)
        run: python scripts/broker_eps_safe_publish.py
      - name: Commit only changed EPS data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/broker_eps_forecasts.json data/broker_eps_processed.json data/broker_eps_review_queue.json data/broker_eps_comparisons.json
          if git diff --cached --quiet; then echo 'No EPS changes'; exit 0; fi
          git commit -m 'Publish broker EPS comparisons offline'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
