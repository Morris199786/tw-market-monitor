name: Self Report Rule July October Backtest (Private)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact V17 model dependencies
        run: pip install numpy==2.1.3 scikit-learn==1.6.1 scipy==1.14.1 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Rebuild official attention rule strategy
        run: python scripts/self_report_rule_backtest.py --out private_rule_backtest_v2
      - name: Compare rule A B C with V17 on matching valid dates
        run: |
          python scripts/self_report_rule_compare.py \
            --rule-dir private_rule_backtest_v2 \
            --out private_rule_v17_compare
      - name: Upload independent rule and V17 comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-report-rule-v17-comparison
          path: |
            private_rule_backtest_v2/
            private_rule_v17_compare/
          retention-days: 30
          if-no-files-found: warn
