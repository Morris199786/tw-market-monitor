name: Backfill Taiwan market history 2008–2023
on: workflow_dispatch
concurrency:
  group: backfill-market-2008
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: .cache/tw-history
          key: tw-history-v1-${{ matrix.year }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tw-history-v1-${{ matrix.year }}-
      - run: python scripts/backfill_market_history.py ${{ matrix.year }}
      - uses: actions/cache/save@v4
        if: ${{ failure() && hashFiles('.cache/tw-history/**') != '' }}
        with:
          path: .cache/tw-history
          key: tw-history-v1-${{ matrix.year }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: history-${{ matrix.year }}
          path: history-result/*.json
          if-no-files-found: error
  publish:
    needs: history
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: history-*
          merge-multiple: true
          path: history-result
      - run: python scripts/backfill_market_history.py assemble
      - name: Publish verified history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/history/monitor-{funds,breadth}-2008-2023.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: add verified market history for 2008–2023'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
